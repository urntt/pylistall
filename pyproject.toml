[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pylistall"
version = "0.3.0"
description = "Copy file contents under a directory to clipboard with tree and optional git log."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "urntt"}]
dependencies = ["pyperclip>=1.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pylistall = "pylistall.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/urntt/pylistall"
Repository = "https://github.com/urntt/pylistall"
Issues = "https://github.com/urntt/pylistall/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers", "-ra"]
xfail_strict = true
